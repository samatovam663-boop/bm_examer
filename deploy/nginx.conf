# /etc/nginx/sites-available/bm_examer  (HTTPS uchun: sudo certbot --nginx -d exam.example.uz)
server {
    listen 80;
    server_name exam.example.uz;

    client_max_body_size 12m;          # rasm va fayl yuklash (Django chegarasi: 10 MB)

    # frontend (npm run build:http natijasi)
    root /var/www/bm_examer;
    index index.html;
    location / { try_files $uri /index.html; }

    # backend
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    # DJANGO_BEHIND_PROXY=1 shu sarlavhaga tayanadi
        proxy_read_timeout 120s;                       # Claude bilan savol yaratish uzoq davom etishi mumkin
    }

    location /static/ { alias /srv/bm_examer/backend/staticfiles/; expires 7d; }
    location /media/  { alias /srv/bm_examer/backend/media/;       expires 7d; }
}
